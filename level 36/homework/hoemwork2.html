<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Shop - RGB Colors</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .color-box {
            display: inline-block;
            width: 150px;
            height: 150px;
            margin: 10px;
            border: 1px solid #ddd;
            text-align: center;
            line-height: 150px;
            color: white;
            font-weight: bold;
        }
        .nav {
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>Paint Shop - RGB Colors</h1>
    <div class="nav">
 
    </div>

    <div class="color-box" style="background-color: rgb(255, 0, 0);">RGB(255,0,0)</div>
    <div class="color-box" style="background-color: rgb(0, 255, 0);">RGB(0,255,0)</div>
    <div class="color-box" style="background-color: rgb(0, 0, 255);">RGB(0,0,255)</div>
    <div class="color-box" style="background-color: rgb(255, 255, 0);">RGB(255,255,0)</div>
    <div class="color-box" style="background-color: rgb(255, 165, 0);">RGB(255,165,0)</div>
    <div class="color-box" style="background-color: rgb(75, 0, 130);">RGB(75,0,130)</div>
    <div class="color-box" style="background-color: rgb(238, 130, 238);">RGB(238,130,238)</div>
</body>
</html>
